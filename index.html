<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07070a">
<title>TOP 500 GERMANY</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap');

  :root {
    --bg: #07070a;
    --glass: rgba(255,255,255,0.045);
    --glass-strong: rgba(255,255,255,0.08);
    --border: rgba(255,255,255,0.09);
    --border-light: rgba(255,255,255,0.18);
    --text: #fff;
    --text-muted: #a2a2b2;
    --red: #e10600;
    --gold: #ffcf1f;
    --correct: #2be08a;
    --wrong: #ff4d6d;
    --display: 'Anton', Impact, 'Arial Narrow Bold', sans-serif;
    --body: 'Barlow', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --vsize: 196px;
    --grad: linear-gradient(135deg, var(--red), #ff7a00 55%, var(--gold));
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 12px 16px 70px;
    position: relative;
    overflow-x: hidden;
  }

  /* ---------- Aurora-Hintergrund ---------- */
  .aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .aurora span {
    position: absolute;
    width: 70vmax; height: 70vmax;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.5;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .aurora .a1 { background: radial-gradient(circle, rgba(225,6,0,0.75), transparent 65%); top: -35vmax; left: -30vmax; }
  .aurora .a2 { background: radial-gradient(circle, rgba(255,207,31,0.5), transparent 65%); top: -30vmax; right: -35vmax; animation-delay: -6s; }
  .aurora .a3 { background: radial-gradient(circle, rgba(225,6,0,0.5), transparent 65%); bottom: -45vmax; left: 5vmax; animation-delay: -11s; }
  @keyframes drift {
    from { transform: translate3d(0,0,0) scale(1); }
    to { transform: translate3d(6vmax, 5vmax, 0) scale(1.15); }
  }
  .grain {
    position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: 0.05;
    background-image: radial-gradient(#fff 1px, transparent 1px);
    background-size: 3px 3px;
  }

  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .app { width: 100%; max-width: 480px; display: flex; flex-direction: column; flex: 1; }

  /* ---------- Header ---------- */
  .top-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; }
  .top-group { display: flex; align-items: center; gap: 8px; }

  .top-icon, .lang-btn, .streak-badge {
    background: var(--glass);
    border: 1px solid var(--border);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    height: 38px;
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--body); font-size: 14px; font-weight: 700;
    transition: all 0.2s ease;
  }
  .top-icon, .lang-btn { width: 38px; border-radius: 50%; cursor: pointer; }
  .top-icon:hover, .lang-btn:hover { background: var(--glass-strong); border-color: var(--gold); }
  .top-icon:active, .lang-btn:active { transform: scale(0.9); }

  .streak-badge { padding: 0 14px; gap: 6px; border-radius: 20px; user-select: none; }
  .streak-badge.active {
    color: var(--gold);
    border-color: rgba(255,207,31,0.55);
    background: rgba(255,207,31,0.12);
    box-shadow: 0 0 20px rgba(255,207,31,0.25);
  }

  .brand { text-align: center; margin: 12px 0 20px; }
  .badge {
    display: inline-block;
    font-size: 11px; font-weight: 700; letter-spacing: 0.32em;
    padding: 4px 12px 4px 14px;
    border-radius: 20px;
    border: 1px solid var(--border-light);
    background: var(--glass);
    color: var(--text-muted);
    margin-bottom: 10px;
  }
  .brand h1 { font-family: var(--display); font-weight: 400; line-height: 0.9; text-transform: uppercase; }
  .brand .big {
    display: block;
    font-size: clamp(64px, 21vw, 92px);
    letter-spacing: 0.02em;
    background: linear-gradient(100deg, #fff 0%, #fff 35%, var(--gold) 50%, #fff 65%, #fff 100%);
    background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    animation: shimmer 5s linear infinite;
    filter: drop-shadow(0 4px 0 rgba(225,6,0,0.9)) drop-shadow(0 0 28px rgba(225,6,0,0.45));
  }
  @keyframes shimmer { from { background-position: 150% 0; } to { background-position: -100% 0; } }
  .brand .out {
    display: block;
    font-size: clamp(34px, 11.5vw, 52px);
    letter-spacing: 0.22em; margin-right: -0.22em;
    color: transparent;
    -webkit-text-stroke: 1.5px var(--gold);
    text-shadow: 0 0 30px rgba(255,207,31,0.25);
  }
  .flag {
    display: flex; width: 140px; height: 7px; margin: 14px auto 10px;
    border-radius: 4px; overflow: hidden;
    box-shadow: 0 0 0 1px var(--border-light), 0 0 18px rgba(225,6,0,0.35);
  }
  .flag span { flex: 1; }
  .flag .f1 { background: #000; } .flag .f2 { background: var(--red); } .flag .f3 { background: var(--gold); }

  .tagline { font-size: 13px; font-weight: 500; color: var(--text-muted); display: inline-flex; align-items: center; gap: 8px; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--correct); box-shadow: 0 0 8px var(--correct); display: none; }
  .live-dot.on { display: inline-block; animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }

  /* ---------- Versuche ---------- */
  .attempts-container { display: flex; flex-direction: column; gap: 6px; margin-bottom: 22px; }

  .attempt-box {
    height: 40px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--glass);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: center; gap: 12px;
    padding: 0 14px 0 0;
    font-size: 14px; font-weight: 500; color: var(--text-muted);
    overflow: hidden;
    transition: all 0.25s ease;
  }
  .attempt-box .n {
    flex: 0 0 40px; align-self: stretch;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--display); font-size: 18px;
    color: var(--text-muted);
    background: rgba(255,255,255,0.04);
    border-right: 1px solid var(--border);
    transition: all 0.25s ease;
  }
  .attempt-box .lbl { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .attempt-box .dur { font-size: 12px; font-weight: 700; opacity: 0.7; }

  .attempt-box.active { border-color: var(--gold); box-shadow: 0 0 18px rgba(255,207,31,0.18); transform: scale(1.01); }
  .attempt-box.active .n { background: var(--gold); color: #000; border-right-color: var(--gold); }
  .attempt-box.correct { border-color: var(--correct); background: rgba(43,224,138,0.12); color: var(--correct); box-shadow: 0 0 18px rgba(43,224,138,0.22); }
  .attempt-box.correct .n { background: var(--correct); color: #000; border-right-color: var(--correct); }
  .attempt-box.wrong { border-color: var(--wrong); background: rgba(255,77,109,0.1); color: var(--wrong); }
  .attempt-box.wrong .n { background: var(--wrong); color: #000; border-right-color: var(--wrong); }
  .attempt-box.skipped { background: rgba(255,255,255,0.02); }
  .attempt-box.filled { animation: slide 0.3s ease; }
  @keyframes slide { from { transform: translateX(-8px); opacity: 0.4; } to { transform: none; opacity: 1; } }

  /* ---------- Player / Vinyl ---------- */
  .player-section { margin-top: auto; display: flex; flex-direction: column; align-items: center; position: relative; }

  .instruction { color: var(--text-muted); font-size: 14px; text-align: center; margin-bottom: 14px; font-weight: 500; min-height: 20px; }

  .deck { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; margin-bottom: 20px; }

  .eq { display: flex; align-items: flex-end; justify-content: center; gap: 4px; height: 76px; width: 48px; }
  .eq i {
    display: block; width: 6px; height: 14%; border-radius: 3px;
    background: linear-gradient(to top, var(--red), var(--gold));
    opacity: 0.4; transform-origin: bottom;
  }
  .eq.on i { opacity: 1; animation: bounce 0.9s ease-in-out infinite; box-shadow: 0 0 10px rgba(255,207,31,0.5); }
  @keyframes bounce { 0%, 100% { height: 14%; } 50% { height: 100%; } }

  .vinyl-wrap { position: relative; width: var(--vsize); height: var(--vsize); flex: 0 0 auto; }
  .vinyl-wrap::before {
    content: ""; position: absolute; inset: -10px; border-radius: 50%;
    border: 2px solid rgba(255,207,31,0.0);
    transition: all 0.3s ease;
  }
  .vinyl-wrap.playing::before { border-color: rgba(255,207,31,0.45); animation: ring 1.6s ease-out infinite; }
  @keyframes ring { from { transform: scale(0.96); opacity: 1; } to { transform: scale(1.14); opacity: 0; } }

  .vinyl {
    position: absolute; inset: 0; border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, transparent 0 33%, rgba(255,255,255,0.06) 33.5% 34%, transparent 34.5% 44%, rgba(255,255,255,0.05) 44.5% 45%, transparent 45.5% 58%, rgba(255,255,255,0.04) 58.5% 59%, transparent 60% 72%, rgba(255,255,255,0.035) 72.5% 73%, transparent 74%),
      conic-gradient(from 25deg, #09090b, #23232b 12%, #09090b 25%, #23232b 37%, #09090b 50%, #23232b 62%, #09090b 75%, #23232b 87%, #09090b);
    box-shadow: 0 0 0 2px #000, 0 20px 50px rgba(0,0,0,0.75), 0 0 70px rgba(225,6,0,0.22);
    animation: spin 2.4s linear infinite; animation-play-state: paused;
  }
  .vinyl.spin { animation-play-state: running; box-shadow: 0 0 0 2px #000, 0 20px 50px rgba(0,0,0,0.75), 0 0 80px rgba(255,207,31,0.32); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .vinyl-label {
    position: absolute; inset: 31%; border-radius: 50%;
    background: linear-gradient(to bottom, #000 0 33.3%, var(--red) 33.3% 66.6%, var(--gold) 66.6%);
    background-size: cover; background-position: center;
    box-shadow: 0 0 0 3px #000;
  }
  .vinyl-label::after {
    content: ""; position: absolute; left: 50%; top: 50%; width: 9%; height: 9%;
    transform: translate(-50%, -50%); background: var(--bg); border-radius: 50%;
    box-shadow: 0 0 0 2px rgba(0,0,0,0.6);
  }

  .big-play-btn {
    position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px;
    border-radius: 50%; border: 2px solid var(--text);
    background: rgba(7,7,10,0.72); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    color: var(--text); display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 20px rgba(0,0,0,0.6); z-index: 2;
  }
  .big-play-btn:hover:not(:disabled) { transform: scale(1.08); background: var(--gold); border-color: var(--gold); color: #000; }
  .big-play-btn:active:not(:disabled) { transform: scale(0.94); }
  .big-play-btn:disabled { opacity: 0.45; cursor: wait; }
  .big-play-btn svg { width: 25px; height: 25px; fill: currentColor; margin-left: 2px; }

  .timeline-wrapper { width: 100%; margin-bottom: 8px; }
  .timeline-bar {
    width: 100%; height: 14px; background: rgba(255,255,255,0.05); border-radius: 7px;
    display: flex; position: relative; overflow: hidden;
    border: 1px solid var(--border); box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
  }
  .timeline-segment { height: 100%; border-right: 2px solid var(--bg); background: rgba(255,255,255,0.035); transition: background 0.3s; }
  .timeline-segment:last-of-type { border-right: none; }
  .timeline-segment.reached { background: rgba(255,207,31,0.16); }
  .timeline-progress {
    position: absolute; top: 0; left: 0; bottom: 0; width: 0%;
    background: var(--grad); border-radius: 7px; pointer-events: none;
    box-shadow: 0 0 14px rgba(255,160,0,0.6);
  }

  .time-row { display: flex; justify-content: space-between; width: 100%; margin-bottom: 20px; }
  .time-label { font-size: 13px; font-weight: 600; color: var(--text-muted); font-variant-numeric: tabular-nums; }

  /* ---------- Eingabe ---------- */
  .input-container { position: relative; width: 100%; }
  .search-box {
    width: 100%;
    background: var(--glass); border: 1px solid var(--border); border-radius: 12px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    padding: 15px 40px; color: var(--text);
    font-family: var(--body); font-size: 15px; outline: none; transition: all 0.2s ease;
  }
  .search-box:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,207,31,0.14); }
  .search-box:disabled { opacity: 0.5; }
  .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; pointer-events: none; }
  .clear-icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); cursor: pointer; font-size: 14px; display: none; }

  .suggestions {
    position: absolute; bottom: 100%; left: 0; right: 0;
    background: rgba(18,18,24,0.96); border: 1px solid var(--border-light); border-radius: 12px;
    max-height: 230px; overflow-y: auto; z-index: 10; display: none; margin-bottom: 6px;
    box-shadow: 0 -6px 28px rgba(0,0,0,0.65);
  }
  .suggestions.open { display: block; }
  .suggestions div { padding: 12px 16px; font-size: 14px; cursor: pointer; border-bottom: 1px solid var(--border); }
  .suggestions div:last-child { border-bottom: none; }
  .suggestions div:hover { background: var(--glass-strong); }

  .action-btns { display: flex; gap: 10px; margin-top: 10px; width: 100%; }
  .btn-action {
    flex: 1; background: var(--glass); border: 1px solid var(--border); color: var(--text);
    padding: 14px; border-radius: 12px; font-family: var(--body); font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all 0.2s ease;
  }
  .btn-action:hover { background: var(--glass-strong); border-color: var(--border-light); }
  .btn-action:active { transform: scale(0.97); }
  .btn-action.primary { background: var(--grad); border-color: transparent; color: #000; box-shadow: 0 6px 22px rgba(255,120,0,0.3); }
  .btn-action.primary:hover { filter: brightness(1.1); }

  /* ---------- Ergebnis ---------- */
  .result-box {
    text-align: center; margin-top: 6px; padding: 22px 20px;
    background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-radius: 18px; border: 1px solid var(--border-light);
    display: none; width: 100%; box-shadow: 0 10px 34px rgba(0,0,0,0.6);
  }
  .result-box.show { display: block; animation: pop 0.4s cubic-bezier(.2,.9,.3,1.2); }
  .result-box.win { border-color: rgba(43,224,138,0.6); box-shadow: 0 0 36px rgba(43,224,138,0.2), 0 10px 34px rgba(0,0,0,0.6); }
  .result-box.lose { border-color: rgba(255,77,109,0.6); box-shadow: 0 0 36px rgba(255,77,109,0.18), 0 10px 34px rgba(0,0,0,0.6); }
  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(0.96); } to { opacity: 1; transform: none; } }

  .cover-art-container {
    width: 150px; height: 150px; margin: 0 auto 14px; border-radius: 12px; overflow: hidden;
    border: 1px solid var(--border-light); background: #000; box-shadow: 0 10px 28px rgba(0,0,0,0.6);
  }
  .cover-art-container img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .result-status { font-family: var(--display); font-size: 28px; letter-spacing: 0.05em; margin-bottom: 4px; text-transform: uppercase; }
  .result-title { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
  .rank-chip {
    display: inline-block; font-family: var(--display); font-size: 15px; letter-spacing: 0.06em;
    padding: 4px 14px; border-radius: 6px; background: var(--grad); color: #000; margin-bottom: 16px;
  }
  .result-box .btn-action { width: 100%; margin-bottom: 10px; flex: none; }
  .result-box .btn-action:last-child { margin-bottom: 0; }

  /* ---------- Konfetti ---------- */
  .confetti { position: fixed; top: -12px; width: 9px; height: 14px; z-index: 200; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0.9; } }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    display: flex; align-items: center; justify-content: center; z-index: 100;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .modal-content {
    background: rgba(20,20,26,0.97); border: 1px solid var(--border-light);
    border-radius: 18px; width: 90%; max-width: 400px; padding: 26px; position: relative;
    box-shadow: 0 14px 50px rgba(0,0,0,0.8); overflow: hidden;
  }
  .modal-content::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--grad); }
  .modal-content h3 { font-family: var(--display); font-weight: 400; font-size: 25px; letter-spacing: 0.04em; margin-bottom: 12px; text-transform: uppercase; }
  .modal-content p { font-size: 15px; color: var(--text-muted); line-height: 1.55; margin-bottom: 12px; }
  .modal-close { position: absolute; top: 14px; right: 14px; background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; }
  .stat-grid { display: flex; justify-content: space-around; text-align: center; margin: 20px 0 4px; }
  .stat-val { font-family: var(--display); font-size: 38px; background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .stat-lbl { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  /* ---------- Cookie-Abfrage ---------- */
  .cookie-banner {
    position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    width: calc(100% - 28px); max-width: 452px;
    transform: translate(-50%, 140%);
    background: rgba(20,20,26,0.97); border: 1px solid var(--border-light);
    border-radius: 18px; padding: 18px 18px 16px; z-index: 150;
    box-shadow: 0 14px 50px rgba(0,0,0,0.85); overflow: hidden;
    transition: transform 0.45s cubic-bezier(.2,.9,.3,1.1);
  }
  .cookie-banner.show { transform: translate(-50%, 0); }
  .cookie-banner::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--grad); }
  .cookie-title { font-family: var(--display); font-size: 21px; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 6px; }
  .cookie-text { font-size: 13.5px; color: var(--text-muted); line-height: 1.5; margin-bottom: 14px; }
  .cookie-btns { display: flex; gap: 10px; }
  .cookie-btns .btn-action { padding: 12px; font-size: 14px; }
  .footer-link { background: none; border: none; color: var(--text-muted); font: inherit; text-decoration: underline; cursor: pointer; }

  /* ---------- Footer ---------- */
  .footer {
    position: fixed; bottom: 0; left: 0; width: 100%;
    background: rgba(5,5,8,0.9); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-top: 1px solid var(--border);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    text-align: center; font-size: 12px; color: var(--text-muted); letter-spacing: 0.3px; z-index: 50;
  }
  .footer::before { content: ""; position: absolute; top: -1px; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, #000 0 33.3%, var(--red) 33.3% 66.6%, var(--gold) 66.6%); }
  .footer a { color: var(--text-muted); text-decoration: underline; }

  @media (max-height: 760px) {
    :root { --vsize: 150px; }
    .brand { margin: 8px 0 14px; }
    .attempts-container { margin-bottom: 14px; }
    .attempt-box { height: 36px; font-size: 13px; }
    .eq { height: 56px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .vinyl, .eq.on i, .result-box.show, .aurora span, .brand .big, .vinyl-wrap.playing::before { animation: none !important; }
  }
</style>
</head>
<body>

<div class="aurora"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>
<div class="grain"></div>

<div class="app">
  <header>
    <div class="top-bar">
      <div class="top-group">
        <button class="lang-btn" id="btnLang" aria-label="Sprache">DE</button>
        <button class="top-icon" id="btnInfo" title="Info" aria-label="Info">i</button>
      </div>
      <div class="top-group">
        <div class="streak-badge" id="streakBadge" title="Erfolgsserie">🔥 <span id="streakCount">0</span></div>
        <button class="top-icon" id="btnStats" title="Statistik" aria-label="Statistik">📊</button>
        <button class="top-icon" id="btnHelp" title="Hilfe" aria-label="Hilfe">?</button>
      </div>
    </div>

    <div class="brand">
      <div class="badge">HEARDLE</div>
      <h1><span class="big">TOP 500</span><span class="out">GERMANY</span></h1>
      <div class="flag"><span class="f1"></span><span class="f2"></span><span class="f3"></span></div>
      <div class="tagline"><span class="live-dot" id="liveDot"></span><span id="txtTagline"></span></div>
    </div>
  </header>

  <div class="attempts-container" id="attemptsContainer"></div>

  <div class="player-section">
    <div class="instruction" id="txtInstruction"></div>

    <div class="deck">

    helpText: "1. Нажмите Play для прослушивания.<br>2. Угадайте исполнителя и трек.<br>3. Пропуск или ошибка открывают больше времени (0.1с, 1с, 3с, 5с, 8с, 10с, 15с). Если трек играет, он просто продолжается!",
    statsTitle: "Статистика", statPlayed: "Сыграно", statWins: "Побед", statRate: "% Побед",
    cookieTitle: "🍪 Cookies",
    cookieText: "Можно сохранить вашу статистику и серию побед в браузере? Мы используем только локальное хранилище — без трекеров и передачи данных.",
    cookieYes: "Принять", cookieNo: "Отклонить",
    cookieState: { yes: "Сохранение: вкл", no: "Сохранение: выкл", none: "Пока не выбрано" }
  }
};

/* ---------- Hilfsfunktionen ---------- */
function cleanTitle(t) { return t.replace(/\(.*?\)|\[.*?\]/g, ' ').replace(/\s+/g, ' ').trim(); }
function norm(s) {
  return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9\u0400-\u04FF]+/g, ' ').trim();
}

/* ---------- Live-Charts (Apple Music Top 100 Deutschland) ---------- */
async function loadLiveChart() {
  try {
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 4000);
    const res = await fetch('https://rss.applemarketingtools.com/api/v2/de/music/most-played/100/songs.json', { signal: ctrl.signal });
    clearTimeout(to);
    if (!res.ok) return;
    const data = await res.json();
    const list = (data.feed && data.feed.results) || [];
    const seen = new Set();
    const merged = [];
    for (const r of list) {
      if (!r.artistName || !r.name) continue;
      const key = norm(cleanTitle(r.name));
      if (seen.has(key)) continue;
      seen.add(key);
      merged.push({
        artist: r.artistName, title: r.name,
        cover: r.artworkUrl100 ? r.artworkUrl100.replace(/\d+x\d+bb/, '600x600bb') : null
      });
    }
    if (merged.length < 50) return;
    for (const s of BUILTIN_SONGS) {
      const key = norm(cleanTitle(s.title));
      if (seen.has(key)) continue;
      seen.add(key);
      merged.push(s);
    }
    SONGS = merged.slice(0, 500);
    chartSource = 'live';
  } catch (e) { /* Eingebaute Liste bleibt aktiv */ }
}

/* ---------- Vorschau & Cover über die iTunes Search API ---------- */
const trackCache = new Map();

function lookupTrack(song) {
  const key = `${song.artist}|${song.title}`.toLowerCase();
  if (trackCache.has(key)) return trackCache.get(key);

  const p = (async () => {
    try {
      const mainArtist = song.artist.split(/ feat\.| ft\.| & |, | x /i)[0].trim();
      const term = `${mainArtist} ${cleanTitle(song.title)}`;
      const url = `https://itunes.apple.com/search?term=${encodeURIComponent(term)}&media=music&entity=song&country=DE&limit=15`;
      const ctrl = new AbortController();
      const to = setTimeout(() => ctrl.abort(), 6000);
      const res = await fetch(url, { signal: ctrl.signal });
      clearTimeout(to);
      if (!res.ok) return null;
      const data = await res.json();
      const results = (data.results || []).filter(r => r.previewUrl);
      const nt = norm(cleanTitle(song.title));
      const na = norm(mainArtist);
      const best =
        results.find(r => norm(r.trackName).includes(nt) && norm(r.artistName).includes(na)) ||
        results.find(r => norm(r.trackName).includes(nt));
      if (!best) return null;
      return {
        preview: best.previewUrl,
        cover: best.artworkUrl100 ? best.artworkUrl100.replace('100x100bb', '600x600bb') : null
      };
    } catch (e) { return null; }
  })();

  trackCache.set(key, p);
  return p;
}

function loadAudio(src) {
  return new Promise((resolve) => {
    let done = false;
    const fin = (ok) => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      audio.removeEventListener('canplay', onOk);
      audio.removeEventListener('error', onErr);
      resolve(ok);
    };
    const onOk = () => fin(true);
    const onErr = () => fin(false);
    const timer = setTimeout(() => fin(false), 7000);
    audio.addEventListener('canplay', onOk);
    audio.addEventListener('error', onErr);
    audio.src = src;
    audio.load();
  });
}

async function pickAndLoadSong() {
  const tried = new Set();
  for (let rounds = 0; rounds < 14; rounds++) {
    let idx, guard = 0;
    do {
      idx = Math.floor(Math.random() * SONGS.length);
      guard++;
    } while ((idx === lastSongIndex || tried.has(idx)) && guard < 60);
    tried.add(idx);

    const song = SONGS[idx];
    const track = await lookupTrack(song);
    if (!track || !track.preview) continue;
    if (!(await loadAudio(track.preview))) continue;

    currentSong = song;
    currentSong.rank = idx + 1;
    currentTrack = track;
    lastSongIndex = idx;
    return true;
  }
  return false;
}

function placeholderCover(song) {
  const match = song.title.match(/[A-Za-zА-Яа-я0-9]/);
  const letter = (match ? match[0] : 'T').toUpperCase();
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000"/><stop offset="0.5" stop-color="#dd0000"/><stop offset="1" stop-color="#ffce00"/></linearGradient></defs><rect width="200" height="200" fill="url(#g)"/><text x="100" y="135" font-family="Impact, sans-serif" font-size="100" fill="#fff" text-anchor="middle">${letter}</text></svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}

/* ---------- UI-Aufbau ---------- */
const attemptsContainer = document.getElementById('attemptsContainer');

function fmtDur(d) {
  return String(d).replace('.', currentLang === 'EN' ? '.' : ',') + (currentLang === 'RU' ? 'с' : 's');
}

function renderAttemptBoxes() {
  attemptsContainer.innerHTML = '';
  DURATIONS.forEach((d, i) => {
    const box = document.createElement('div');
    box.className = 'attempt-box' + (i === 0 ? ' active' : '');
    box.innerHTML = `<span class="n">${i + 1}</span><span class="lbl"></span><span class="dur">${fmtDur(d)}</span>`;
    attemptsContainer.appendChild(box);
  });
}

function markActiveAttempt() {
  document.querySelectorAll('.attempt-box').forEach((b, i) => b.classList.toggle('active', !gameOver && i === attempt));
  document.querySelectorAll('.timeline-segment').forEach((s, i) => s.classList.toggle('reached', i <= attempt));
}

const timelineBar = document.getElementById('timelineBar');
DURATIONS.forEach((d, i) => {
  const seg = document.createElement('div');
  seg.className = 'timeline-segment';
  const prev = i === 0 ? 0 : DURATIONS[i - 1];
  seg.style.width = ((d - prev) / totalTime * 100) + '%';
  timelineBar.insertBefore(seg, document.getElementById('timelineProgress'));
});

['eqL', 'eqR'].forEach((id) => {
  const el = document.getElementById(id);
  for (let i = 0; i < 6; i++) {
    const b = document.createElement('i');
    b.style.animationDelay = (i * 0.13 + (id === 'eqR' ? 0.2 : 0)) + 's';
    b.style.animationDuration = (0.7 + (i % 3) * 0.2) + 's';
    el.appendChild(b);
  }
});

function formatTime(sec) {
  if (sec < 1) return '0:00.' + Math.round(sec * 10);
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}

function setPlayingUI(on) {
  isPlaying = on;
  document.getElementById('vinyl').classList.toggle('spin', on);
  document.getElementById('vinylWrap').classList.toggle('playing', on);
  document.getElementById('eqL').classList.toggle('on', on);
  document.getElementById('eqR').classList.toggle('on', on);
  document.getElementById('playIcon').innerHTML = on
    ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
}

function updateStreakUI() {
  document.getElementById('streakCount').textContent = streak;
  document.getElementById('streakBadge').classList.toggle('active', streak > 0);
}

function updateLanguageUI() {
  const t = TRANSLATIONS[currentLang];
  document.getElementById('btnLang').textContent = currentLang;
  document.documentElement.lang = currentLang.toLowerCase();
  if (!gameOver && currentSong) document.getElementById('txtInstruction').textContent = t.instruction;
  document.getElementById('guessInput').placeholder = t.placeholder;
  document.getElementById('skipBtn').textContent = t.skip;
  document.getElementById('submitBtn').textContent = t.submit;
  document.getElementById('fullPlayBtn').textContent = t.fullPlay;
  document.getElementById('nextBtn').textContent = t.next;
  document.getElementById('cookieTitle').textContent = t.cookieTitle;
  document.getElementById('cookieText').textContent = t.cookieText;
  document.getElementById('cookieYes').textContent = t.cookieYes;
  document.getElementById('cookieNo').textContent = t.cookieNo;
  document.getElementById('txtTagline').textContent = t.tagline.replace('{n}', SONGS.length) + (chartSource === 'live' ? ' · LIVE' : '');
  document.getElementById('liveDot').classList.toggle('on', chartSource === 'live');
  document.querySelectorAll('.attempt-box .dur').forEach((el, i) => { el.textContent = fmtDur(DURATIONS[i]); });
}

/* ---------- Wiedergabe ---------- */
function clearTimers() {
  clearTimeout(playTimer);
  clearInterval(progressTimer);
}

function stopPlayback() {
  clearTimers();
  audio.pause();
  try { audio.currentTime = 0; } catch (e) {}
  setPlayingUI(false);
}

/* Ende des Schnipsels: Zeitanzeige springt auf die volle Sekundenzahl (aufgerundet) */
function snippetEnd() {
  const maxSec = DURATIONS[attempt] || totalTime;
  stopPlayback();
  document.getElementById('timelineProgress').style.width = Math.min(100, maxSec / totalTime * 100) + '%';
  document.getElementById('currentTime').textContent = formatTime(maxSec);
}

function startStopTimer(sec) {
  clearTimeout(playTimer);
  playTimer = setTimeout(snippetEnd, Math.max(0, sec) * 1000);
}

function startProgress() {
  clearInterval(progressTimer);
  progressTimer = setInterval(() => {
    const maxSec = DURATIONS[attempt] || totalTime;
    const elapsed = Math.min(audio.currentTime, maxSec);
    document.getElementById('timelineProgress').style.width = Math.min(100, elapsed / totalTime * 100) + '%';
    document.getElementById('currentTime').textContent = formatTime(elapsed);
    if (audio.currentTime >= maxSec) clearInterval(progressTimer);
  }, 40);
}

audio.addEventListener('play', () => setPlayingUI(true));
audio.addEventListener('pause', () => setPlayingUI(false));
audio.addEventListener('ended', () => { clearTimers(); setPlayingUI(false); });

function playSnippet() {
  if (!currentSong || gameOver) return;
  if (isPlaying) { stopPlayback(); return; }

  clearTimers();
  document.getElementById('timelineProgress').style.width = '0%';
  document.getElementById('currentTime').textContent = formatTime(0);
  try { audio.currentTime = 0; } catch (e) {}

  const begin = () => {
    startProgress();
    startStopTimer(DURATIONS[attempt] - audio.currentTime);
  };
  const p = audio.play();
  if (p && p.then) p.then(begin).catch(() => setPlayingUI(false));
  else begin();
}

/* Läuft der Song gerade und man skippt (oder tippt falsch), läuft er weiter bis zur neuen Länge. */
function extendPlayback() {
  startProgress();
  startStopTimer(DURATIONS[attempt] - audio.currentTime);
}

/* ---------- Spiellogik ---------- */
function handleGuess(userGuess, isSkip = false) {
  if (gameOver || !currentSong) return;

  const t = TRANSLATIONS[currentLang];
  const boxes = document.querySelectorAll('.attempt-box');
  const box = boxes[attempt];
  const lbl = box.querySelector('.lbl');
  const wasPlaying = isPlaying;

  const fullName = `${currentSong.artist} - ${currentSong.title}`;
  const isCorrect = !isSkip && norm(userGuess) === norm(fullName);

  if (isSkip) {
    lbl.textContent = t.skippedText;
    box.classList.add('skipped');
  } else {
    lbl.textContent = userGuess;
    box.classList.add(isCorrect ? 'correct' : 'wrong');
  }
  box.classList.add('filled');

  if (isCorrect) {
    endGame(true);
  } else {
    attempt++;
    if (attempt >= DURATIONS.length) {
      endGame(false);
    } else {
      document.getElementById('maxTime').textContent = formatTime(DURATIONS[attempt]);
      markActiveAttempt();
      if (wasPlaying) extendPlayback();
    }
  }

  document.getElementById('guessInput').value = '';
  document.getElementById('clearBtn').style.display = 'none';
  document.getElementById('suggestions').classList.remove('open');
}

function confetti() {
  const colors = ['#e10600', '#ffcf1f', '#ffffff', '#ff7a00', '#2be08a'];
  for (let i = 0; i < 46; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (1.6 + Math.random() * 1.8) + 's';
    c.style.animationDelay = (Math.random() * 0.4) + 's';
    c.style.transform = `rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4200);
  }
}

function endGame(won) {
  gameOver = true;
  clearTimers();
  markActiveAttempt();

  const t = TRANSLATIONS[currentLang];
  stats.played++;
  if (won) { stats.wins++; streak++; } else { streak = 0; }
  updateStreakUI();
  saveProgress();

  document.getElementById('inputContainer').style.display = 'none';
  document.getElementById('actionBtns').style.display = 'none';
  document.getElementById('txtInstruction').textContent = '';

  const resBox = document.getElementById('resultBox');
  resBox.classList.remove('win', 'lose');
  resBox.classList.add('show', won ? 'win' : 'lose');
  document.getElementById('resultStatus').textContent = (won ? '🎉 ' : '❌ ') + (won ? t.won : t.lost);
  document.getElementById('resultTitle').textContent = `${currentSong.artist} - ${currentSong.title}`;
  document.getElementById('rankChip').textContent = t.rank.replace('{n}', currentSong.rank);

  const coverUrl = currentSong.cover || (currentTrack && currentTrack.cover) || placeholderCover(currentSong);
  document.getElementById('coverImg').src = coverUrl;
  const label = document.getElementById('vinylLabel');
  label.style.backgroundImage = `url("${coverUrl}")`;

  if (won) confetti();

  try { audio.currentTime = 0; } catch (e) {}
  audio.play().catch(() => {});
}

function toggleFullPlay() {
  if (audio.paused) audio.play().catch(() => {});
  else audio.pause();
}

async function startNewGame() {
  gameOver = false;
  attempt = 0;
  roundId++;
  const myRound = roundId;
  clearTimers();
  audio.pause();
  setPlayingUI(false);
  currentSong = null;

  renderAttemptBoxes();
  markActiveAttempt();

  document.getElementById('vinylLabel').style.backgroundImage = '';
  document.getElementById('resultBox').classList.remove('show', 'win', 'lose');
  document.getElementById('inputContainer').style.display = 'block';
  document.getElementById('actionBtns').style.display = 'flex';
  document.getElementById('guessInput').value = '';
  document.getElementById('guessInput').disabled = true;
  document.getElementById('clearBtn').style.display = 'none';
  document.getElementById('currentTime').textContent = '0:00.0';
  document.getElementById('maxTime').textContent = formatTime(DURATIONS[0]);
  document.getElementById('timelineProgress').style.width = '0%';
  document.getElementById('playBtn').disabled = true;
  document.getElementById('txtInstruction').textContent = TRANSLATIONS[currentLang].loading;

  const ok = await pickAndLoadSong();
  if (myRound !== roundId) return;

  document.getElementById('playBtn').disabled = false;
  document.getElementById('guessInput').disabled = false;
  document.getElementById('txtInstruction').textContent = ok
    ? TRANSLATIONS[currentLang].instruction
    : TRANSLATIONS[currentLang].loadError;
}

/* ---------- Events ---------- */
document.getElementById('playBtn').addEventListener('click', playSnippet);
document.getElementById('fullPlayBtn').addEventListener('click', toggleFullPlay);

document.getElementById('submitBtn').addEventListener('click', () => {
  const val = document.getElementById('guessInput').value.trim();
  if (val) handleGuess(val);
});
document.getElementById('skipBtn').addEventListener('click', () => handleGuess('', true));
document.getElementById('nextBtn').addEventListener('click', startNewGame);

document.getElementById('btnLang').addEventListener('click', () => {
  currentLang = currentLang === 'DE' ? 'EN' : currentLang === 'EN' ? 'RU' : 'DE';
  updateLanguageUI();
});

const input = document.getElementById('guessInput');
const suggestions = document.getElementById('suggestions');
const clearBtn = document.getElementById('clearBtn');

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const val = input.value.trim();
    if (val) handleGuess(val);
  }
});

input.addEventListener('input', () => {
  const val = norm(input.value);
  clearBtn.style.display = input.value ? 'block' : 'none';
  suggestions.innerHTML = '';
  if (!val) { suggestions.classList.remove('open'); return; }

  const matches = SONGS.filter(s => norm(`${s.artist} ${s.title}`).includes(val));

  matches.slice(0, 8).forEach(m => {
    const fullName = `${m.artist} - ${m.title}`;
    const div = document.createElement('div');
    div.textContent = fullName;
    div.addEventListener('click', () => {
      input.value = fullName;
      suggestions.classList.remove('open');
    });
    suggestions.appendChild(div);
  });

  suggestions.classList.toggle('open', matches.length > 0);
});

clearBtn.addEventListener('click', () => {
  input.value = '';
  clearBtn.style.display = 'none';
  suggestions.classList.remove('open');
});

const overlay = document.getElementById('modalOverlay');
const modalBody = document.getElementById('modalBody');
function openModal(html) { modalBody.innerHTML = html; overlay.classList.add('active'); }
document.getElementById('modalClose').addEventListener('click', () => overlay.classList.remove('active'));
overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('active'); });

document.getElementById('btnInfo').addEventListener('click', () => {
  const t = TRANSLATIONS[currentLang];
  openModal(`<h3>${t.infoTitle}</h3><p>${t.infoText}</p>`);
});
document.getElementById('btnStats').addEventListener('click', () => {
  const t = TRANSLATIONS[currentLang];
  const rate = stats.played > 0 ? Math.round((stats.wins / stats.played) * 100) : 0;
  openModal(`
    <h3>${t.statsTitle}</h3>
    <div class="stat-grid">
      <div><div class="stat-val">${stats.played}</div><div class="stat-lbl">${t.statPlayed}</div></div>
      <div><div class="stat-val">${stats.wins}</div><div class="stat-lbl">${t.statWins}</div></div>
      <div><div class="stat-val">${rate}%</div><div class="stat-lbl">${t.statRate}</div></div>
    </div>
    <p style="margin-top:16px;font-size:12px;text-align:center">🍪 ${t.cookieState[consent === 'yes' ? 'yes' : consent === 'no' ? 'no' : 'none']}</p>`);
});
document.getElementById('btnHelp').addEventListener('click', () => {
  const t = TRANSLATIONS[currentLang];
  openModal(`<h3>${t.helpTitle}</h3><p>${t.helpText}</p>`);
});

document.getElementById('cookieYes').addEventListener('click', () => setConsent('yes'));
document.getElementById('cookieNo').addEventListener('click', () => setConsent('no'));
document.getElementById('cookieLink').addEventListener('click', showCookieBanner);

/* ---------- Start ---------- */
(async function init() {
  renderAttemptBoxes();
  updateStreakUI();
  updateLanguageUI();
  document.getElementById('playBtn').disabled = true;
  document.getElementById('guessInput').disabled = true;
  document.getElementById('txtInstruction').textContent = TRANSLATIONS[currentLang].loading;
  if (consent !== 'yes' && consent !== 'no') setTimeout(showCookieBanner, 600);
  await loadLiveChart();
  updateLanguageUI();
  startNewGame();
})();
</script>
