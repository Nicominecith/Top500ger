<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e9e4fb">
<meta http-equiv="Content-Security-Policy" content="default-src * data: blob: gap: 'unsafe-inline' 'unsafe-eval'; frame-src *; media-src * blob: data:;">
<title>Heardle Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Unbounded:wght@600;800&display=swap">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Unbounded:wght@600;800&display=swap');

  :root {
    --bg:#ece7ff; --card:#ffffff; --ink:#15141d; --muted:#76738c; --line:rgba(20,19,40,.07); --seg:#f1eefc;
    --accent:#c9b8ff; --dock:rgba(14,14,18,.9);
    --f:'Outfit',system-ui,Roboto,'Segoe UI',sans-serif; --d:'Unbounded','Outfit',system-ui,sans-serif;
    --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px); --dockh:68px;
    --shadow:0 14px 34px -16px rgba(60,40,140,.35);
  }
  html[data-t="dark"] { --bg:#0f0e16; --card:#1c1b27; --ink:#f4f2ff; --muted:#9d9bb3; --line:rgba(255,255,255,.08); --seg:#2a2938; --dock:rgba(5,5,8,.92); --shadow:0 14px 34px -16px rgba(0,0,0,.8); }
  html[data-m="off"] *, html[data-m="off"] *::before, html[data-m="off"] *::after { animation:none !important; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }
  html,body { height:100%; background:var(--bg); color:var(--ink); font-family:var(--f); overflow:hidden; overscroll-behavior:none; user-select:none; -webkit-user-select:none; transition:background .3s; }
  button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; text-align:left; }
  input { font:inherit; color:inherit; user-select:text; -webkit-user-select:text; }
  :focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  svg.i { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }

  .rip { position:relative; overflow:hidden; }
  .wave { position:absolute; border-radius:50%; background:rgba(255,255,255,.4); transform:scale(0); animation:wave .55s ease-out forwards; pointer-events:none; }
  @keyframes wave { to { transform:scale(1); opacity:0; } }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes drift { from { transform:translate3d(0,0,0) scale(1); } to { transform:translate3d(-8vmax,6vmax,0) scale(1.2); } }
  @keyframes vin { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  @keyframes eq { 0%,100% { transform:scaleY(.25); } 50% { transform:scaleY(1); } }
  @keyframes grow { from { transform:scaleY(0); } to { transform:scaleY(1); } }

  /* Hintergrund-Glühen */
  .bgfx { position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .bgfx i { position:absolute; border-radius:50%; filter:blur(70px); width:70vmax; height:70vmax; animation:drift 16s ease-in-out infinite alternate; }
  .bgfx i:nth-child(1) { background:var(--accent); opacity:.55; top:-38vmax; right:-34vmax; }
  .bgfx i:nth-child(2) { background:#ffb8d0; opacity:.35; bottom:-44vmax; left:-36vmax; animation-delay:-8s; }
  html[data-t="dark"] .bgfx i:nth-child(1) { opacity:.28; } html[data-t="dark"] .bgfx i:nth-child(2) { opacity:.14; }

  /* Splash */
  #splash { position:fixed; inset:0; z-index:60; background:var(--bg); display:grid; place-items:center; text-align:center; transition:opacity .4s; }
  #splash.off { opacity:0; pointer-events:none; }
  #splash h1 { font-family:var(--d); font-weight:800; font-size:26px; margin-top:18px; letter-spacing:-.03em; }
  .bars { display:flex; align-items:flex-end; justify-content:center; gap:6px; height:54px; }
  .bars span { width:10px; border-radius:5px; transform-origin:bottom; animation:grow .6s cubic-bezier(.2,.9,.3,1) both; }

  /* Ansichten */
  .view { position:absolute; inset:0; z-index:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:calc(var(--top) + 16px) 18px calc(var(--dockh) + var(--bot) + 44px); display:none; }
  .view.on { display:block; animation:vin .38s cubic-bezier(.2,.8,.2,1) both; }
  .col { max-width:520px; margin:0 auto; }

  .top { display:flex; align-items:center; gap:12px; }
  .ava { width:50px; height:50px; border-radius:50%; background:var(--accent); display:grid; place-items:center; font-size:25px; flex:none; box-shadow:0 0 0 3px var(--card), 0 8px 18px -8px rgba(0,0,0,.4); }
  .top .who { flex:1; min-width:0; }
  .top b { display:block; font-size:19px; font-weight:600; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .top small { color:var(--muted); font-size:13px; }
  .rbtn { width:44px; height:44px; border-radius:50%; background:var(--card); display:grid; place-items:center; box-shadow:var(--shadow); }

  /* Banner */
  .banner { position:relative; width:100%; min-height:178px; margin-top:20px; border-radius:32px; color:#15141d; padding:22px; overflow:hidden; display:block;
    background:radial-gradient(120% 120% at 100% 0%, rgba(255,255,255,.55), transparent 55%), linear-gradient(140deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #ff9ec4));
    box-shadow:0 22px 40px -22px var(--accent); }
  .banner::after { content:""; position:absolute; inset:0; background:linear-gradient(115deg, transparent 40%, rgba(255,255,255,.28) 50%, transparent 60%); transform:translateX(-120%); animation:shine 5.5s ease-in-out 1.5s infinite; pointer-events:none; }
  @keyframes shine { 0%,60% { transform:translateX(-120%); } 100% { transform:translateX(120%); } }
  .banner h2 { font-family:var(--d); font-size:24px; font-weight:800; line-height:1.08; max-width:58%; letter-spacing:-.03em; }
  .banner p { font-size:14.5px; margin-top:8px; max-width:56%; opacity:.72; font-weight:500; }
  .go { margin-top:18px; display:inline-flex; align-items:center; gap:9px; background:#15141d; color:#fff; padding:10px 16px 10px 12px; border-radius:99px; font-weight:600; font-size:14.5px; position:relative; z-index:2; }
  .go svg { fill:#fff; stroke:none; width:16px; height:16px; }
  .eq { display:inline-flex; align-items:flex-end; gap:2px; height:14px; margin-left:2px; }
  .eq b { width:3px; height:100%; border-radius:2px; background:#3ddc97; transform-origin:bottom; animation:eq .9s ease-in-out infinite; }
  .eq b:nth-child(2) { animation-delay:.15s; background:#ffb800; } .eq b:nth-child(3) { animation-delay:.3s; background:#ff3366; } .eq b:nth-child(4) { animation-delay:.45s; }
  .shape { position:absolute; }
  .s1 { right:-34px; top:-22px; width:150px; height:150px; border-radius:50%; background:repeating-radial-gradient(circle,#09090d 0 2px,#1d1d28 2px 4px); animation:spin 10s linear infinite; box-shadow:0 16px 30px rgba(0,0,0,.3); }
  .s1::before { content:""; position:absolute; inset:0; border-radius:50%; background:conic-gradient(from 30deg, transparent 0 18%, rgba(255,255,255,.16) 24%, transparent 30% 68%, rgba(255,255,255,.12) 74%, transparent 80%); }
  .s1::after { content:""; position:absolute; inset:50px; border-radius:50%; background:#ff9f1c; box-shadow:inset 0 0 0 5px rgba(0,0,0,.18); }
  .s2 { right:92px; bottom:-40px; width:104px; height:104px; border-radius:50%; border:22px solid #ffd23f; opacity:.95; }
  .s3 { right:-18px; bottom:20px; width:96px; height:46px; border-radius:23px; background:#15141d; transform:rotate(-26deg); opacity:.88; }

  h3.sec { font-family:var(--d); font-size:15px; font-weight:800; letter-spacing:-.02em; margin:30px 2px 14px; display:flex; align-items:center; justify-content:space-between; }

  /* Hörstufen */
  .stepsrow { display:flex; gap:7px; overflow-x:auto; padding:2px 0 6px; scrollbar-width:none; }
  .stepsrow::-webkit-scrollbar { display:none; }
  .stp { position:relative; overflow:hidden; flex:1 0 40px; height:78px; border-radius:22px; background:var(--card); box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; }
  .stp::before { content:""; position:absolute; left:0; right:0; bottom:0; height:var(--h); background:var(--c); opacity:.38; }
  .stp small, .stp b { position:relative; }
  .stp small { font-size:11px; color:var(--muted); font-weight:600; }
  .stp b { font-size:14.5px; font-weight:700; letter-spacing:-.02em; }
  .stp.hot { background:var(--ink); color:var(--bg); } .stp.hot::before { opacity:.9; } .stp.hot small { color:inherit; opacity:.6; }

  /* Spielkarten */
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:13px; }
  .grid.list { grid-template-columns:1fr; }
  .gcard { position:relative; height:252px; border-radius:30px; padding:16px; background:var(--bgc); color:#15141d; overflow:hidden; display:flex; flex-direction:column; transition:transform .15s; box-shadow:0 18px 32px -18px var(--dc); }
  .gcard:active { transform:scale(.965); }
  .grid.list .gcard { height:178px; } .grid.list .gcard p { max-width:58%; } .grid.list .gcard h4 { max-width:62%; } .grid.list .gv { width:150px; height:150px; right:-30px; bottom:-30px; }
  .wm { position:absolute; right:-6px; top:2px; font-family:var(--d); font-weight:800; font-size:76px; line-height:1; letter-spacing:-.06em; color:#fff; opacity:.28; pointer-events:none; }
  .tag { position:relative; align-self:flex-start; font-size:12px; font-weight:600; padding:5px 11px; border-radius:99px; background:rgba(255,255,255,.62); backdrop-filter:blur(6px); }
  .gcard h4 { position:relative; font-family:var(--d); font-size:17px; font-weight:800; line-height:1.1; margin-top:auto; letter-spacing:-.03em; }
  .gcard p { position:relative; font-size:13px; line-height:1.3; margin-top:6px; opacity:.72; font-weight:500; }
  .src { position:relative; z-index:2; margin-top:12px; display:inline-flex; align-items:center; gap:6px; align-self:flex-start; font-size:11px; font-weight:600; background:rgba(21,20,29,.86); color:#fff; padding:6px 9px 6px 8px; border-radius:99px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dc); box-shadow:0 0 8px var(--dc); }
  .gv { position:absolute; right:-44px; bottom:-44px; width:124px; height:124px; border-radius:50%; background:repeating-radial-gradient(circle,#09090d 0 2px,#1d1d28 2px 4px); animation:spin 9s linear infinite; box-shadow:0 10px 22px rgba(0,0,0,.35); }
  .gv::before { content:""; position:absolute; inset:0; border-radius:50%; background:conic-gradient(from 30deg, transparent 0 18%, rgba(255,255,255,.16) 24%, transparent 30% 68%, rgba(255,255,255,.12) 74%, transparent 80%); }
  .gv::after { content:""; position:absolute; inset:42px; border-radius:50%; background:var(--dc); }
  .pb { position:absolute; z-index:3; right:12px; bottom:12px; width:36px; height:36px; border-radius:50%; background:#fff; color:#15141d; display:grid; place-items:center; box-shadow:0 6px 14px rgba(0,0,0,.3); }
  .pb svg { width:16px; height:16px; fill:currentColor; margin-left:2px; }
  .last { position:absolute; z-index:3; top:14px; right:14px; width:11px; height:11px; border-radius:50%; background:#15141d; box-shadow:0 0 0 3px rgba(255,255,255,.75); }

  /* Listen */
  .list { background:var(--card); border-radius:28px; padding:4px 18px; margin-top:6px; box-shadow:var(--shadow); }
  .row { width:100%; display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row .ic { width:42px; height:42px; border-radius:14px; background:var(--seg); display:grid; place-items:center; flex:none; }
  .row .tx { flex:1; min-width:0; } .row .tx b { display:block; font-size:16px; font-weight:600; } .row .tx small { color:var(--muted); font-size:13px; }
  .row .ch { color:var(--muted); }

  /* Einstellungen */
  .shead { display:flex; align-items:center; justify-content:space-between; }
  .shead h2 { font-family:var(--d); font-size:15px; font-weight:800; letter-spacing:-.02em; }
  .sprof { margin-top:20px; border-radius:32px; padding:20px; display:flex; align-items:center; gap:16px; color:#15141d; position:relative; overflow:hidden;
    background:radial-gradient(120% 120% at 100% 0%, rgba(255,255,255,.5), transparent 55%), linear-gradient(140deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #ff9ec4)); }
  .sprof .ava { width:70px; height:70px; font-size:36px; background:rgba(255,255,255,.7); box-shadow:none; }
  .sprof b { font-family:var(--d); font-size:19px; font-weight:800; letter-spacing:-.03em; display:block; word-break:break-word; }
  .sprof small { opacity:.7; font-size:13px; font-weight:500; display:block; margin-top:3px; }
  .tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px; }
  .tile { border-radius:24px; padding:14px 12px 15px; color:#15141d; }
  .tile small { font-size:12px; opacity:.7; display:block; font-weight:500; }
  .tile b { font-size:19px; font-weight:700; display:block; margin-top:8px; }
  .grp { background:var(--card); border-radius:28px; padding:18px; margin-top:14px; box-shadow:var(--shadow); }
  .grp > h5 { font-family:var(--d); font-size:13px; font-weight:800; letter-spacing:-.02em; margin-bottom:12px; }
  .grp .hint { color:var(--muted); font-size:13px; margin:-6px 0 12px; }
  .seg { display:flex; gap:4px; padding:4px; background:var(--seg); border-radius:99px; }
  .seg button { flex:1; text-align:center; padding:11px 6px; border-radius:99px; font-size:14px; font-weight:600; color:var(--muted); transition:background .2s,color .2s; }
  .seg button.on { background:var(--ink); color:var(--bg); }
  .sub { font-size:13px; color:var(--muted); margin:18px 0 10px; font-weight:500; }
  .sw { display:flex; gap:12px; }
  .sw button { width:46px; height:46px; border-radius:50%; background:var(--c); display:grid; place-items:center; color:#15141d; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08); transition:transform .2s; }
  .sw button.on { transform:scale(1.12); box-shadow:0 0 0 3px var(--card), 0 0 0 5px var(--ink); }
  .sw button svg { opacity:0; } .sw button.on svg { opacity:1; }
  .avs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .avs button { width:48px; height:48px; border-radius:50%; background:var(--seg); display:grid; place-items:center; font-size:24px; text-align:center; }
  .avs button.on { background:var(--accent); box-shadow:0 0 0 2px var(--ink); }
  .field { width:100%; background:var(--seg); border:0; border-radius:18px; padding:14px 16px; font-size:16px; outline:none; }
  .tg { display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--line); width:100%; }
  .tg:last-child { border-bottom:0; padding-bottom:0; } .tg:first-of-type { padding-top:0; }
  .tg .tx { flex:1; } .tg .tx b { display:block; font-size:16px; font-weight:600; } .tg .tx small { color:var(--muted); font-size:13px; }
  .sw2 { width:52px; height:31px; border-radius:16px; background:var(--seg); position:relative; flex:none; transition:background .2s; }
  .sw2::after { content:""; position:absolute; top:3px; left:3px; width:25px; height:25px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .25s cubic-bezier(.3,1.4,.5,1); }
  .tg.on .sw2 { background:#2fbf71; } .tg.on .sw2::after { transform:translateX(21px); }
  .danger b { color:#e5484d; }
  .ver { text-align:center; color:var(--muted); font-size:12px; margin:22px 0 4px; }

  /* Dock */
  .dock { position:fixed; z-index:30; left:50%; transform:translateX(-50%); bottom:calc(14px + var(--bot)); width:calc(100% - 32px); max-width:400px; height:var(--dockh); border-radius:36px; background:var(--dock); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); display:flex; align-items:center; justify-content:space-around; padding:0 10px; box-shadow:0 18px 36px -10px rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.08); }
  #ind { position:absolute; left:0; top:50%; margin-top:-26px; width:52px; height:52px; border-radius:50%; background:#fff; opacity:0; transition:transform .38s cubic-bezier(.3,1.25,.5,1), opacity .2s; box-shadow:0 0 20px rgba(255,255,255,.35); }
  .dock button { position:relative; z-index:1; width:52px; height:52px; border-radius:50%; display:grid; place-items:center; color:#d9d7e6; transition:color .25s, transform .2s; }
  .dock button.on { color:#111; }
  .dock button:active { transform:scale(.88); }
  .dock .wave { background:rgba(255,255,255,.3); } .dock button.on .wave { background:rgba(0,0,0,.18); }

  /* Spiel */
  #game { position:absolute; inset:0; display:none; flex-direction:column; background:#0d0d10; z-index:20; padding-bottom:calc(var(--dockh) + var(--bot) + 28px); }
  #game.on { display:flex; }
  .sf { height:var(--top); flex:none; background:#0d0d10; }
  .fb { position:relative; flex:1; min-height:0; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#0d0d10; }
  .loader { position:absolute; inset:0; z-index:2; display:grid; place-items:center; background:#0d0d10; transition:opacity .25s; }
  .loader.off { opacity:0; pointer-events:none; }
  .loader .bars span { animation:eq .9s ease-in-out infinite; height:100% !important; background:#fff !important; }
  .loader .bars span:nth-child(2n) { animation-delay:.15s; } .loader .bars span:nth-child(3n) { animation-delay:.3s; }

  /* Sheet + Toast */
  #ov { position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.5); backdrop-filter:blur(3px); opacity:0; pointer-events:none; transition:opacity .25s; }
  #ov.on { opacity:1; pointer-events:auto; }
  #sheet { position:absolute; left:0; right:0; bottom:0; background:var(--card); border-radius:32px 32px 0 0; padding:12px 24px calc(var(--bot) + 26px); transform:translateY(100%); transition:transform .35s cubic-bezier(.2,.8,.2,1); max-width:560px; margin:0 auto; }
  #ov.on #sheet { transform:none; }
  #sheet .grab { width:44px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 18px; }
  #sheet h3 { font-family:var(--d); font-size:19px; font-weight:800; letter-spacing:-.03em; margin-bottom:14px; }
  #sheet ol { list-style:none; counter-reset:n; }
  #sheet li { counter-increment:n; display:flex; gap:14px; align-items:flex-start; color:var(--ink); font-size:15.5px; line-height:1.45; margin-bottom:12px; }
  #sheet li::before { content:counter(n); flex:none; width:28px; height:28px; border-radius:50%; background:var(--accent); color:#15141d; display:grid; place-items:center; font-weight:700; font-size:14px; }
  #sheet .net { margin-top:6px; padding:13px 15px; border-radius:18px; background:var(--seg); font-size:14px; color:var(--muted); }
  #sheet .ok { margin-top:16px; width:100%; text-align:center; padding:15px; border-radius:99px; background:var(--ink); color:var(--bg); font-weight:600; }
  #toast { position:fixed; z-index:70; left:50%; bottom:calc(var(--dockh) + var(--bot) + 40px); transform:translate(-50%,20px); background:var(--ink); color:var(--bg); padding:11px 20px; border-radius:99px; font-size:14px; font-weight:500; opacity:0; transition:all .25s; pointer-events:none; }
  #toast.on { opacity:1; transform:translate(-50%,0); }


  /* ===== GLAS-DESIGN ===== */
  :root { --card:rgba(255,255,255,.5); --seg:rgba(255,255,255,.5); --gb:rgba(255,255,255,.7); --hi:inset 0 1px 0 rgba(255,255,255,.75); --shadow:0 18px 40px -20px rgba(70,50,160,.5); --dock:rgba(20,18,34,.5); }
  html[data-t="dark"] { --card:rgba(255,255,255,.07); --seg:rgba(255,255,255,.09); --gb:rgba(255,255,255,.14); --hi:inset 0 1px 0 rgba(255,255,255,.14); --shadow:0 18px 40px -20px rgba(0,0,0,.9); --dock:rgba(8,8,16,.5); }
  .bgfx i { width:62vmax; height:62vmax; }
  .bgfx i:nth-child(1) { opacity:.8; } .bgfx i:nth-child(2) { opacity:.6; }
  .bgfx i:nth-child(3) { background:#6ee7d0; opacity:.5; top:30%; left:-30vmax; animation-delay:-4s; animation-duration:20s; }
  html[data-t="dark"] .bgfx i:nth-child(1) { opacity:.4; } html[data-t="dark"] .bgfx i:nth-child(2) { opacity:.28; } html[data-t="dark"] .bgfx i:nth-child(3) { opacity:.2; }
  .rbtn,.stp,.list,.grp,.tile,.tag,.field,.net { backdrop-filter:blur(22px) saturate(180%); -webkit-backdrop-filter:blur(22px) saturate(180%); border:1px solid var(--gb); box-shadow:var(--hi), var(--shadow); }
  .tile { color:var(--ink); }
  .tile small { opacity:.6; }
  .field { box-shadow:var(--hi); }
  .tag { box-shadow:none; background:rgba(255,255,255,.55); }
  .stp { box-shadow:var(--hi), var(--shadow); }
  .banner,.sprof,.gcard { border:1px solid rgba(255,255,255,.55); box-shadow:inset 0 1px 0 rgba(255,255,255,.7), inset 0 -20px 40px -30px rgba(255,255,255,.35), 0 22px 40px -22px var(--accent); }
  .gcard { box-shadow:inset 0 1px 0 rgba(255,255,255,.7), inset 0 -20px 40px -30px rgba(255,255,255,.35), 0 20px 34px -18px var(--dc); }

  bk:'<svg class="i" viewBox="0 0 24 24"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16 6l4-1 2 14-4 1z"/></svg>'
};
IC.lib = E.bk; I18N.DE.navHome = 'Start'; I18N.EN.navHome = 'Home'; I18N.RU.navHome = 'Главная'; I18N.DE.lib = 'Bibliothek'; I18N.EN.lib = 'Library'; I18N.RU.lib = 'Library';
const lib = $('lib');
const fi = document.createElement('input'); fi.type = 'file'; fi.accept = '.html,.htm,text/html'; fi.multiple = true; fi.hidden = true; document.body.appendChild(fi);
fi.onchange = async () => {
  let n = 0;
  for (const f of fi.files) { try { await addCustom(f.name, await f.text()); n++; } catch (e) { toast(L('bad')); } }
  fi.value = ''; if (n) { renderLib(); renderHome(); toast(L('added')); }
};

function renderLib() {
  lib.innerHTML = '<div class="col"><div class="shead"><button class="rbtn rip" data-a="libback">' + IC.back + '</button><h2>' + L('lib') + '</h2><span style="width:44px"></span></div>'
  + '<div class="list" style="margin-top:20px"><button class="row rip" data-a="libup"><span class="ic">' + E.up + '</span><span class="tx"><b>' + L('add') + '</b><small>' + L('addSub') + '</small></span></button>'
  + '<button class="row rip" data-a="libtpl"><span class="ic">' + E.dl + '</span><span class="tx"><b>' + L('tpl') + '</b><small>' + L('tplSub') + '</small></span></button></div>'
  + '<h3 class="sec">' + L('mine') + '</h3><div class="list">' + GAMES.map(g => '<div class="row"><span class="ic" style="background:' + g.dc + '33"><i class="dot" style="--dc:' + g.dc + '"></i></span><span class="tx"><b>' + esc(g.name) + '</b><small>' + (g.custom ? L('own') : L('std')) + '</small></span>'
    + '<button class="rbtn rip" data-a="libdl" data-id="' + g.id + '" aria-label="' + L('dl') + '">' + E.dl + '</button><button class="rbtn rip" data-a="libedit" data-id="' + g.id + '" aria-label="' + L('edit') + '">' + E.ed + '</button></div>').join('') + '</div></div>';
}

function editor(id) {
  const g = GAMES.find(x => x.id === id); if (!g) return;
  selC = g.dc;
  const f = (l, i, v, m, ty) => '<p class="sub">' + l + '</p><input class="field" id="' + i + '" maxlength="' + m + '" ' + (ty ? 'type="' + ty + '" ' : '') + 'value="' + esc(v) + '">';
  $('sheet').innerHTML = '<div class="grab"></div><h3>' + L('edit') + '</h3>'
  + f(L('name'), 'e_n', g.name, 30) + f(L('sub'), 'e_s', g.sub[S.lang] || g.sub.DE || '', 80) + f(L('wm'), 'e_w', g.wm, 4) + f(L('src'), 'e_r', g.src, 20) + f(L('songs'), 'e_c', g.songs, 5, 'number')
  + '<p class="sub">' + L('color') + '</p><div class="sw" id="ecol" style="flex-wrap:wrap;gap:10px">' + COL.map(c => '<button class="' + (c === selC ? 'on' : '') + '" style="--c:' + c + '" data-a="libcol" data-v="' + c + '" aria-label="' + c + '">' + IC.ok + '</button>').join('') + '</div>'
  + '<button class="ok rip" data-a="libsave" data-id="' + id + '">' + L('save') + '</button>'
  + (g.custom ? '<button class="ok rip" style="background:#e5484d;color:#fff" data-a="libdel" data-id="' + id + '">' + L('del') + '</button>' : META[id] ? '<button class="ok rip" style="background:var(--seg);color:var(--ink)" data-a="librst" data-id="' + id + '">' + L('rst') + '</button>' : '');
  $('ov').classList.add('on');
}

function refresh() { $('ov').classList.remove('on'); renderLib(); renderHome(); }

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a^="lib"]'); if (!el) return;
  const a = el.dataset.a, id = el.dataset.id, g = GAMES.find(x => x.id === id);
  if (a === 'lib') { const gm = view === 'game' && history.state && history.state.game; renderLib(); _sh('library'); lib.classList.add('on'); lib.scrollTop = 0; if (gm) history.back(); }
  else if (a === 'libback') show('home');
  else if (a === 'libup') fi.click();
  else if (a === 'libtpl') dl('heardle-vorlage.html', TPL);
  else if (a === 'libdl' && g) { try { const h = await (await fetch(g.file)).text(); dl(g.custom ? ((g.name.replace(/[^\w\-]+/g, '-') || g.id) + '.html') : g.file, h); } catch (x) { toast(L('bad')); } }
  else if (a === 'libedit') editor(id);
  else if (a === 'libcol') { selC = el.dataset.v; document.querySelectorAll('#ecol button').forEach(b => b.classList.toggle('on', b.dataset.v === selC)); }
  else if (a === 'libsave' && g) {
    META[id] = { name:$('e_n').value.trim() || g.name, sub:$('e_s').value.trim(), wm:$('e_w').value.trim(), src:$('e_r').value.trim(), songs:+$('e_c').value || 0, dc:selC };
    lsv('hh_meta', META); apply(g); refresh(); toast(L('saved'));
  }
  else if (a === 'librst' && g) { delete META[id]; lsv('hh_meta', META); apply(g); refresh(); toast(L('saved')); }
  else if (a === 'libdel' && g && confirm(L('confDel'))) {
    GAMES.splice(GAMES.indexOf(g), 1); CUST = CUST.filter(x => x !== id); lsv('hh_custom', CUST); delete META[id]; lsv('hh_meta', META);
    try { URL.revokeObjectURL(g.file); await idbOp('delete', id); } catch (x) {}
    refresh();
  }
});

/* Hooks in die bestehende App */
const _rh = renderHome;
renderHome = function () {
  _rh();
  document.querySelectorAll('#home .gcard').forEach(c => { const g = GAMES.find(x => x.id === c.dataset.id); const tg = c.querySelector('.tag'); if (g && tg && !(g.songs > 0)) tg.textContent = L('custom'); });
};
const _sh = show;
show = function (x) { lib.classList.remove('on'); _sh(x); };
window.addEventListener('backbutton', e => {
  if (!lib.classList.contains('on')) return;
  e.preventDefault(); e.stopImmediatePropagation();
  if ($('ov').classList.contains('on')) $('ov').classList.remove('on'); else show('home');
}, true);

/* Anpassungen anwenden, eigene Heardles laden */
GAMES.forEach(apply);
(async () => {
  for (const id of CUST) { try { const h = await idbOp('get', id); if (h == null) continue; const g = { id, file:blobUrl(h), custom:true, sub:{} }; apply(g); GAMES.push(g); } catch (e) {} }
  renderAll();
})();
})();

/* ===== Start ===== */
$('gback').innerHTML = IC.back; logoBars($('logo')); logoBars($('lbars'));
applyTheme(); renderAll();
if (S.splash) setTimeout(() => $('splash').classList.add('off'), 1300); else $('splash').classList.add('off');
if (S.auto && getLast()) setTimeout(() => openGame(getLast()), S.splash ? 1000 : 100);
</script>
</body>
</html>
